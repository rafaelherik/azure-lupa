name: Release

# Runs only when a GitHub release is published (not when drafted). The package is attached to the
# release as an npm tarball instead of being published to the npm registry.
on:
  release:
    types: [published]

permissions:
  contents: write # upload release assets

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # No dependency cache in the release job (cache-poisoning risk).
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Set version from release tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run build
      - name: Pack
        run: |
          npm pack
          sha256sum azure-lupa-*.tgz > SHA256SUMS
      - name: Attach to the release
        run: gh release upload "$GITHUB_REF_NAME" azure-lupa-*.tgz SHA256SUMS --clobber
        env:
          GH_TOKEN: ${{ github.token }}
