name: Release Drafter

on:
  push:
    branches: [main]
  # pull_request_target so the autolabeler can label PRs from forks.
  # Safe: this workflow never checks out PR code.
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          # Only ever keep a draft; publishing is a manual click on GitHub.
          publish: false

  label:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      # Job permissions replace the workflow's, so reading .github/release-drafter.yml needs this too.
      contents: read
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter/autolabeler@v7
