name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "🚀 Features"
    labels: [feature, enhancement]
  - title: "🐛 Fixes"
    labels: [fix, bug]
  - title: "🧰 Maintenance"
    labels: [chore, ci, docs, dependencies]

exclude-labels: [skip-changelog]

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels: [breaking]
  minor:
    labels: [feature, enhancement]
  patch:
    labels: [fix, bug, chore, dependencies, docs, ci]
  default: patch

autolabeler:
  - label: breaking
    title:
      - '/^\w+(\(.+\))?!:/'
    body:
      - "/BREAKING CHANGE/"
  - label: feature
    branch:
      - '/^feat(ure)?\/.+/'
    title:
      - "/^feat/i"
  - label: fix
    branch:
      - '/^(fix|bugfix|hotfix)\/.+/'
    title:
      - "/^fix/i"
  - label: chore
    branch:
      - '/^(chore|ci|build|refactor)\/.+/'
    title:
      - "/^(chore|ci|build|refactor)/i"
  - label: docs
    branch:
      - '/^docs?\/.+/'
    title:
      - "/^docs/i"

template: |
  ## Changes

  $CHANGES

  **Install:** download `azure-lupa-$RESOLVED_VERSION.tgz` below, then `npm install -g ./azure-lupa-$RESOLVED_VERSION.tgz` and run `azure-lupa`.
