version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  install:
    desc: Install dependencies (only when package.json or the lockfile change)
    cmds:
      - npm ci
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json

  dev:
    desc: Run API (:4517) + Vite (:5173); open http://localhost:5173/#token=dev
    deps: [install]
    interactive: true
    cmds:
      - npm run dev

  build:
    desc: Type-check, build the web app and the server bundle
    deps: [install]
    cmds:
      - npm run build
    sources:
      - src/**/*
      - package.json
      - tsconfig.json
      - vite.config.ts
      - tsup.config.ts
    generates:
      - dist/**/*

  test:
    desc: Run unit tests (pass extra args after --, e.g. task test -- src/foo)
    deps: [install]
    cmds:
      - npm test -- {{.CLI_ARGS}}

  test:watch:
    desc: Run unit tests in watch mode
    deps: [install]
    interactive: true
    cmds:
      - npx vitest {{.CLI_ARGS}}

  typecheck:
    desc: Type-check without emitting
    deps: [install]
    cmds:
      - npm run typecheck

  start:
    desc: Build and run the CLI (pass options after --, e.g. task start -- --no-open)
    deps: [build]
    interactive: true
    cmds:
      - node bin/azure-lupa.js {{.CLI_ARGS}}

  clean:
    desc: Remove build output
    cmds:
      - rm -rf dist
