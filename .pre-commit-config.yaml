# Install once with: pre-commit install
# Local hooks run the tools from node_modules, so run `npm install` first.
default_install_hook_types: [pre-commit, commit-msg]
exclude: ^(\.github/(skills|agents)/|dist/|assets/|DESIGN\.md$|PRODUCT\.md$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: oxlint
        name: oxlint
        entry: npx --no-install oxlint --deny-warnings
        language: system
        types_or: [javascript, jsx, ts, tsx]
      - id: prettier
        name: prettier
        entry: npx --no-install prettier --check --ignore-unknown
        language: system
        types: [text]
      - id: commitlint
        name: commitlint
        entry: npx --no-install commitlint --edit
        language: system
        stages: [commit-msg]
        always_run: true
        pass_filenames: false
